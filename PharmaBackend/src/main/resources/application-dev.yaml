
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB}
    username: ${DB_USERNAME:PHARMADB}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    pe.edu.upeu.PharmaBackend: DEBUG
    org.hibernate.SQL: DEBUG

aplicacion:
  cors:
    origenes: ${FRONTEND_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiracion-minutos: 60
