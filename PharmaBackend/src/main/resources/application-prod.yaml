spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 32
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    pe.edu.upeu.PharmaBackend: INFO
    org.hibernate.SQL: WARN
aplicacion:
  cors:
    origenes: ${FRONTEND_ORIGINS:http://localhost:4200}
